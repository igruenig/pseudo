[package]
name = "pseudo-app"
version = "0.0.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow.workspace = true
dirs = "6.0"
